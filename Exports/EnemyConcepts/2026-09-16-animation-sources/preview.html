<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Necrocis 맵 전용 일반몹 12종</title><style>*{box-sizing:border-box}body{margin:0;background:#17131e;color:#f7e4ee;font:16px system-ui,sans-serif;padding:32px;max-width:1440px;margin:auto}h1{font-size:26px}p{color:#c5b1bf}nav{display:flex;gap:10px;flex-wrap:wrap;position:sticky;top:0;background:#17131ef2;padding:16px 0;z-index:1}button{border:1px solid #81526e;background:#2a2031;color:#f7e4ee;padding:10px 20px;border-radius:8px;cursor:pointer}button[aria-pressed=true]{background:#ac557d;color:white}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}article{background:#241d2b;border:1px solid #55394c;border-radius:12px;padding:18px}img{display:block;width:100%;max-width:256px;aspect-ratio:1;image-rendering:pixelated;margin:auto;background:repeating-conic-gradient(#241d2b 0 25%,#2c2334 0 50%) 0/24px 24px}b{font-size:20px}small{color:#d79ab8}h2{margin:30px 0 12px}.info{display:flex;justify-content:space-between;align-items:center;margin-top:12px}@media(max-width:720px){body{padding:16px}.grid{grid-template-columns:1fr}}</style><h1>맵 전용 일반몹 · 12종</h1><p>전원 일반몹 · 공격력 1 · 대기 / 이동 / 공격 / 사망 각 4프레임</p><nav id="controls"></nav><main id="roster"></main><script>const roster=[{"id":"01_stomach_gulp","name":"꿀렁이","biome":"위","ranged":true,"hp":4},{"id":"02_stomach_mucus_snail","name":"점액달팽이","biome":"위","ranged":false,"hp":6},{"id":"03_stomach_overfed_sac","name":"과식낭","biome":"위","ranged":true,"hp":6},{"id":"04_intestine_foldworm","name":"주름벌레","biome":"장","ranged":false,"hp":6},{"id":"05_intestine_villus_hand","name":"융털손","biome":"장","ranged":false,"hp":6},{"id":"06_intestine_knotted_eel","name":"매듭장어","biome":"장","ranged":false,"hp":8},{"id":"07_liver_suture_cell","name":"봉합세포","biome":"간","ranged":true,"hp":4},{"id":"08_liver_clot","name":"혈전덩이","biome":"간","ranged":false,"hp":8},{"id":"09_liver_coagulation_core","name":"응고핵","biome":"간","ranged":true,"hp":6},{"id":"10_lung_breath_bubble","name":"숨방울","biome":"폐","ranged":true,"hp":4},{"id":"11_lung_cilia_brush","name":"섬모솔","biome":"폐","ranged":false,"hp":6},{"id":"12_lung_overinflated_alveoli","name":"과팽창 폐포","biome":"폐","ranged":true,"hp":6}];const actions=[["Idle","대기"],["Move","이동"],["Attack","공격"],["Death","사망"]];let action="Idle",playing=true,frame=0,last=performance.now();const path="../../../Assets/_Project/Art/Images/Enemies/BiomeExclusive/";const preloaded=[];for(const r of roster)for(const [a] of actions)for(let f=0;f<4;f++){const image=new Image();image.src=path+r.id+"/"+a+"_"+f+".png";preloaded.push(image)}for(const biome of ["위","장","간","폐"]){const section=document.createElement("section");section.innerHTML="<h2>"+biome+"</h2><div class=grid>"+roster.filter(r=>r.biome===biome).map(r=>'<article><img data-id="'+r.id+'" src="'+path+r.id+'/Idle_0.png" alt="'+r.name+'"><div class=info><b>'+r.name+'</b><small>'+(r.ranged?"원거리":"근접")+' · HP '+r.hp+'</small></div></article>').join("")+"</div>";document.querySelector("#roster").append(section)}function render(){document.querySelectorAll("img[data-id]").forEach(img=>{img.style.opacity="1";img.src=path+img.dataset.id+"/"+action+"_"+frame+".png"})}for(const [key,label]of actions){const button=document.createElement("button");button.textContent=label;button.setAttribute("aria-pressed",key===action);button.onclick=()=>{action=key;frame=0;last=performance.now();document.querySelectorAll("button[data-action]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.action===key));render()};button.dataset.action=key;document.querySelector("#controls").append(button)}const pause=document.createElement("button");pause.textContent="일시정지";pause.onclick=()=>{playing=!playing;pause.textContent=playing?"일시정지":"재생"};document.querySelector("#controls").append(pause);function tick(now){if(playing&&now-last> (action==="Attack"?140:160)){frame=(frame+1)% (action==="Death"?8:4);if(frame>3){document.querySelectorAll("img[data-id]").forEach(img=>img.style.opacity="0.25")}else{document.querySelectorAll("img[data-id]").forEach(img=>img.style.opacity="1");render()}last=now}requestAnimationFrame(tick)}requestAnimationFrame(tick);</script></html>
